<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>特典納品ページ</title>
<style>
  body{font-family:-apple-system,"Hiragino Sans",sans-serif;background:#f7f9fc;
       color:#222;margin:0;display:flex;min-height:100vh;align-items:center;justify-content:center}
  .card{background:#fff;border-radius:16px;padding:40px 32px;max-width:520px;
        box-shadow:0 8px 30px rgba(0,0,0,.06);text-align:center}
  h1{font-size:20px;margin:0 0 12px}
  p{font-size:15px;line-height:1.8;color:#555;margin:0}
  code{background:#eef2f7;padding:2px 6px;border-radius:6px}
</style>
</head>
<body>
  <div class="card">
    <h1>特典納品ページ</h1>
    <p>各特典は <code>/&lt;job_id&gt;/</code> に個別公開されます。<br>
       お手元の案内メッセージに記載のURLからご覧ください。</p>
  </div>
</body>
</html>
